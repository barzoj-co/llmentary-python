[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "llmentary"
version = "0.7.1"
description = "Python (pytest) client for llmentary: deterministic trace-based integration tests for LLM apps"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Barzoj B.V." }]
keywords = ["llm", "testing", "pytest", "openai", "responses", "chat-completions"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.28.1",
  "jsonschema>=4.25.1",
  "PyYAML>=6.0.1",
]

[project.optional-dependencies]
pytest = ["pytest>=8.4.2"]
openai = ["openai>=2.5.0"]
dev = [
  "build>=1.3.0",
  "mypy>=1.17,<1.18",
  "pytest>=8.4.2",
  "pytest-cov>=7.0.0",
  "ruff>=0.14.1",
  "wheel>=0.45.0",
]

[project.urls]
Homepage = "https://github.com/barzoj-co/llmentary-python"
Repository = "https://github.com/barzoj-co/llmentary-python"
Issues = "https://github.com/barzoj-co/llmentary-python/issues"

[project.entry-points.pytest11]
llmentary = "llmentary.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/llmentary"]
# Release wheels inject a version-pinned Go proxy under bin/; keep VCS-ignored.
artifacts = [
  "src/llmentary/bin/*/llmentary",
  "src/llmentary/bin/*/llmentary.exe",
  "src/llmentary/bin/*/VERSION",
  "src/llmentary/bin/*/AGPL-3.0.txt",
  "src/llmentary/bin/*/openapi.yaml",
]

[tool.hatch.build.targets.sdist]
exclude = [
  "/src/llmentary/bin",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "RUF"]
ignore = ["UP006", "UP007", "UP045"]

[tool.mypy]
python_version = "3.9"
strict = true
files = ["src", "tests"]
exclude = ["tests/e2e", "scripts"]
follow_imports = "skip"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pytest", "_pytest.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.coverage.run]
source = ["llmentary"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.llmentary.coverage]
# Ratchet fail_under upward; do not lower it. CI `coverage report --fail-under`
# reads this table (scripts/coverage_fail_under.py).
fail_under = 92
# Denis: releases require >=90. Applied on release-please PRs.
release_fail_under = 90

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "integration: tests that require the real llmentary Go binary",
  "e2e: tests that call the real OpenAI API through llmentary",
]
