name: good
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: presence
        env:
          HAS_KEY: ${{ secrets.API_TOKEN != '' }}
        run: test "$HAS_KEY" = true
      - name: tests
        env:
          HAS_KEY: ${{ secrets.API_TOKEN != '' }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: pytest
