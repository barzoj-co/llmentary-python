name: good
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: presence
        env:
          HAS_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
        run: test "$HAS_KEY" = true
      - name: tests
        env:
          HAS_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: pytest
