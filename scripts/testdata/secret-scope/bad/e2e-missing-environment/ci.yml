# expect: live e2e job must set environment: openai-e2e
name: CI
on: pull_request
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: pytest
  e2e-gate:
    if: ${{ always() }}
    needs: [e2e]
    runs-on: ubuntu-latest
    steps:
      - run: echo gate
