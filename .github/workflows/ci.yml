name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    env:
      LLMTESTLAB_BIN: /tmp/llmtestlab
      # TODO remove once llm-test-lab is public.
      LLMTESTLAB_REPO_TOKEN: ${{ secrets.LLMTESTLAB_REPO_TOKEN }}
    steps:
      - name: Checkout Python client
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Fail clearly if llm-test-lab repo token is missing
        run: |
          if [ -z "$LLMTESTLAB_REPO_TOKEN" ]; then
            echo "::error title=Missing secret::Add secrets.LLMTESTLAB_REPO_TOKEN with read access to barzoj-co/llm-test-lab."
            exit 1
          fi

      - name: Checkout llm-test-lab proxy
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: barzoj-co/llm-test-lab
          token: ${{ secrets.LLMTESTLAB_REPO_TOKEN }}
          path: llm-test-lab
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26"
          cache-dependency-path: llm-test-lab/go.sum

      - name: Build llm-test-lab proxy
        working-directory: llm-test-lab
        run: go build -o "$LLMTESTLAB_BIN" ./cmd/llmtestlab

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev tools
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy

      - name: Unit and fake-upstream integration tests
        if: matrix.python-version != '3.13'
        run: pytest -m "not e2e"

      - name: Unit and fake-upstream integration tests
        if: matrix.python-version == '3.13'
        run: pytest -m "not e2e" --cov --cov-report=xml:coverage.xml

      - name: Upload coverage artifact
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  coverage:
    name: coverage
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Download coverage artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: coverage-xml

      - name: Upload coverage
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          use_oidc: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
          files: ./coverage.xml
          flags: unit
          fail_ci_if_error: ${{ vars.CODECOV_REQUIRED == 'true' }}

  openai-e2e:
    name: OpenAI E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      LLMTESTLAB_BIN: /tmp/llmtestlab
      LLMTESTLAB_E2E: "1"
      # TODO remove once llm-test-lab is public.
      LLMTESTLAB_REPO_TOKEN: ${{ secrets.LLMTESTLAB_REPO_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LLMTESTLAB_UPSTREAM_BASE_URL: https://api.openai.com/v1
      LLMTESTLAB_UPSTREAM_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LLMTESTLAB_WAIT_TIMEOUT: "30"
    steps:
      - name: Checkout Python client
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Fail clearly if required secrets are missing
        run: |
          if [ -z "$LLMTESTLAB_REPO_TOKEN" ]; then
            echo "::error title=Missing secret::Add secrets.LLMTESTLAB_REPO_TOKEN with read access to barzoj-co/llm-test-lab."
            exit 1
          fi
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error title=Missing secret::Add secrets.OPENAI_API_KEY for real OpenAI E2E tests."
            exit 1
          fi

      - name: Checkout llm-test-lab proxy
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: barzoj-co/llm-test-lab
          token: ${{ secrets.LLMTESTLAB_REPO_TOKEN }}
          path: llm-test-lab
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26"
          cache-dependency-path: llm-test-lab/go.sum

      - name: Build llm-test-lab proxy
        working-directory: llm-test-lab
        run: go build -o "$LLMTESTLAB_BIN" ./cmd/llmtestlab

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package and dev tools
        run: python -m pip install -e ".[dev,openai]"

      - name: Real OpenAI E2E tests
        run: pytest -m e2e -vv --tb=short --durations=0
