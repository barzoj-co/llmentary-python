name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    env:
      LLMENTARY_BIN: /tmp/llmentary
    steps:
      - name: Checkout Python client
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Fail clearly if llmentary repo token is missing
        env:
          HAS_REPO_TOKEN: ${{ secrets.LLMTESTLAB_REPO_TOKEN != '' }}
        run: |
          if [ "$HAS_REPO_TOKEN" != "true" ]; then
            echo "::error title=Missing secret::Add secrets.LLMTESTLAB_REPO_TOKEN with read access to barzoj-co/llmentary."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install pinned proxy release
        env:
          LLMENTARY_REPO_TOKEN: ${{ secrets.LLMTESTLAB_REPO_TOKEN }}
        run: |
          python scripts/install_proxy_release.py --output "$LLMENTARY_BIN"
          python scripts/fetch_isolation_vectors.py --output /tmp/llmentary-isolation-vectors

      - name: Install package and dev tools
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy

      - name: Unit and fake-upstream integration tests
        run: pytest -m "not e2e" -rs

  coverage:
    name: coverage
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      LLMENTARY_BIN: /tmp/llmentary
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Fail clearly if llmentary repo token is missing
        env:
          HAS_REPO_TOKEN: ${{ secrets.LLMTESTLAB_REPO_TOKEN != '' }}
        run: |
          if [ "$HAS_REPO_TOKEN" != "true" ]; then
            echo "::error title=Missing secret::Add secrets.LLMTESTLAB_REPO_TOKEN with read access to barzoj-co/llmentary."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install pinned proxy release
        env:
          LLMENTARY_REPO_TOKEN: ${{ secrets.LLMTESTLAB_REPO_TOKEN }}
        run: |
          python scripts/install_proxy_release.py --output "$LLMENTARY_BIN"
          python scripts/fetch_isolation_vectors.py --output /tmp/llmentary-isolation-vectors

      - name: Install package and dev tools
        run: python -m pip install -e ".[dev]"

      - name: Measure coverage
        env:
          COVERAGE_PR_TITLE: ${{ github.event.pull_request.title || '' }}
          COVERAGE_PR_LABELS: ${{ github.event_name == 'pull_request' && join(github.event.pull_request.labels.*.name, ',') || '' }}
          COVERAGE_HEAD_REF: ${{ github.head_ref || '' }}
        run: |
          coverage run -m pytest -m "not e2e" -rs
          coverage xml -o coverage.xml
          coverage report --fail-under="$(python scripts/coverage_fail_under.py)"

      - name: Upload coverage
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          use_oidc: false
          disable_search: true
          files: ./coverage.xml
          flags: unit
          fail_ci_if_error: ${{ vars.CODECOV_REQUIRED == 'true' }}

  openai-e2e:
    name: OpenAI E2E
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Required reviewers on this environment gate OPENAI_API_KEY. Unit and
    # fake-upstream jobs do not use it and run without approval.
    environment: openai-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LLMENTARY_BIN: /tmp/llmentary
      LLMENTARY_E2E: "1"
      LLMENTARY_UPSTREAM_BASE_URL: https://api.openai.com/v1
      LLMENTARY_WAIT_TIMEOUT: "30"
    steps:
      - name: Checkout Python client
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Fail clearly if required secrets are missing
        env:
          HAS_REPO_TOKEN: ${{ secrets.LLMTESTLAB_REPO_TOKEN != '' }}
          HAS_OPENAI_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
        run: |
          if [ "$HAS_REPO_TOKEN" != "true" ]; then
            echo "::error title=Missing secret::Add secrets.LLMTESTLAB_REPO_TOKEN with read access to barzoj-co/llmentary."
            exit 1
          fi
          if [ "$HAS_OPENAI_KEY" != "true" ]; then
            echo "::error title=Missing secret::Add secrets.OPENAI_API_KEY for real OpenAI E2E tests."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install pinned proxy release
        env:
          LLMENTARY_REPO_TOKEN: ${{ secrets.LLMTESTLAB_REPO_TOKEN }}
        run: python scripts/install_proxy_release.py --output "$LLMENTARY_BIN"

      - name: Install package and dev tools
        run: python -m pip install -e ".[dev,openai]"

      - name: llmentary doctor
        run: python -m llmentary doctor

      - name: Real OpenAI E2E tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLMENTARY_UPSTREAM_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: pytest -m e2e -vv --tb=short --durations=0

  e2e-gate:
    name: e2e-gate
    if: ${{ always() }}
    needs: [openai-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Require live e2e success
        env:
          E2E_RESULT: ${{ needs.openai-e2e.result }}
          EVENT_NAME: ${{ github.event_name }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork == true }}
        run: bash scripts/e2e-gate.sh
