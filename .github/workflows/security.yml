name: Security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:${{ matrix.language }}"
          upload: ${{ github.event.repository.private && 'never' || 'always' }}

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Mark repository as a safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install gitleaks
        env:
          # renovate: datasource=github-releases depName=gitleaks/gitleaks extractVersion=^v(?<version>.*)$
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" gitleaks
          mkdir -p "${HOME}/.local/bin"
          mv gitleaks "${HOME}/.local/bin/gitleaks"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Print commit count
        run: git rev-list --all --count

      - name: Self-test gitleaks config
        run: scripts/check-gitleaks-config.sh --self-test

      - name: Gitleaks git history
        run: gitleaks git --config .gitleaks.toml --redact --no-banner --exit-code 1 --log-opts="--all -m" .

      - name: Gitleaks working tree
        run: gitleaks dir --config .gitleaks.toml --redact --exit-code 1 .

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Audit runtime extras
        env:
          # renovate: datasource=pypi depName=pip-audit
          PIP_AUDIT_VERSION: "2.10.1"
        run: |
          python -m venv /tmp/audit-runtime
          /tmp/audit-runtime/bin/python -m pip install -U pip
          /tmp/audit-runtime/bin/python -m pip install ".[pytest,openai]" "pip-audit==${PIP_AUDIT_VERSION}"
          # The local package is not on PyPI. --strict treats "not found" and
          # --skip-editable skips as fatal, so drop only llmentary and audit
          # the installed extras and their dependencies.
          /tmp/audit-runtime/bin/python -m pip uninstall -y llmentary
          /tmp/audit-runtime/bin/pip-audit --strict --skip-editable --progress-spinner off

      - name: Audit dev extras
        env:
          # renovate: datasource=pypi depName=pip-audit
          PIP_AUDIT_VERSION: "2.10.1"
        run: |
          python -m venv /tmp/audit-dev
          /tmp/audit-dev/bin/python -m pip install -U pip
          /tmp/audit-dev/bin/python -m pip install ".[dev]" "pip-audit==${PIP_AUDIT_VERSION}"
          /tmp/audit-dev/bin/python -m pip uninstall -y llmentary
          /tmp/audit-dev/bin/pip-audit --strict --skip-editable --progress-spinner off
