name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:${{ matrix.language }}"
          upload: ${{ github.event.repository.private && 'never' || 'always' }}

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Audit runtime extras
        env:
          # renovate: datasource=pypi depName=pip-audit
          PIP_AUDIT_VERSION: "2.10.1"
        run: |
          python -m venv /tmp/audit-runtime
          /tmp/audit-runtime/bin/python -m pip install -U pip
          /tmp/audit-runtime/bin/python -m pip install ".[pytest,openai]" "pip-audit==${PIP_AUDIT_VERSION}"
          /tmp/audit-runtime/bin/pip-audit --strict --skip-editable --progress-spinner off

      - name: Audit dev extras
        env:
          # renovate: datasource=pypi depName=pip-audit
          PIP_AUDIT_VERSION: "2.10.1"
        run: |
          python -m venv /tmp/audit-dev
          /tmp/audit-dev/bin/python -m pip install -U pip
          /tmp/audit-dev/bin/python -m pip install ".[dev]" "pip-audit==${PIP_AUDIT_VERSION}"
          /tmp/audit-dev/bin/pip-audit --strict --skip-editable --progress-spinner off
