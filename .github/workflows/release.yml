name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build version-pinned platform wheels
    runs-on: ubuntu-latest
    environment: pypi
    env:
      # TODO remove once llm-test-lab is public.
      LLMTESTLAB_REPO_TOKEN: ${{ secrets.LLMTESTLAB_REPO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Fail clearly if llm-test-lab repo token is missing
        run: |
          if [ -z "$LLMTESTLAB_REPO_TOKEN" ]; then
            echo "::error title=Missing secret::Add secrets.LLMTESTLAB_REPO_TOKEN with read access to barzoj-co/llm-test-lab."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Pin package version to GoReleaser binary version
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          path = Path("pyproject.toml")
          text = path.read_text()
          marker = 'version = "0.1.0"'
          if marker not in text:
              raise SystemExit("Could not find version = \"0.1.0\" in pyproject.toml")
          path.write_text(text.replace(marker, f'version = "{version}"', 1))
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env_file:
              env_file.write(f"LLMTESTLAB_RELEASE_VERSION={version}\n")
          PY

      - name: Install build tools
        run: python -m pip install build wheel

      - name: Build verified platform wheels
        run: python scripts/build_release_wheels.py

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/

      # Trusted Publishing is wired: id-token: write, environment: pypi, and
      # pypa/gh-action-pypi-publish. Actual upload stays disabled until we ship.
      - name: Publish to PyPI
        if: false
        uses: pypa/gh-action-pypi-publish@release/v1
