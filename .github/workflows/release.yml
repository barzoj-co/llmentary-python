name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build version-pinned platform wheels
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # TODO remove once llm-test-lab is public.
      LLMTESTLAB_REPO_TOKEN: ${{ secrets.LLMTESTLAB_REPO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Fail clearly if llm-test-lab repo token is missing
        run: |
          if [ -z "$LLMTESTLAB_REPO_TOKEN" ]; then
            echo "::error title=Missing secret::Add secrets.LLMTESTLAB_REPO_TOKEN with read access to barzoj-co/llm-test-lab."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Assert tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          print(tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"])
          PY
          )"
          if [ "$tag" != "$version" ]; then
            echo "::error title=Version mismatch::Tag ${GITHUB_REF_NAME} does not match project.version=${version}."
            exit 1
          fi

      - name: Export bundled proxy version
        run: |
          version="$(tr -d '[:space:]' < PROXY_VERSION)"
          if [ -z "$version" ]; then
            echo "::error title=Missing PROXY_VERSION::PROXY_VERSION is empty."
            exit 1
          fi
          echo "LLMTESTLAB_RELEASE_VERSION=${version}" >> "$GITHUB_ENV"

      - name: Install build tools
        env:
          # renovate: datasource=pypi depName=twine
          TWINE_VERSION: "7.0.0"
        run: python -m pip install build wheel "twine==${TWINE_VERSION}"

      - name: Build verified platform wheels
        run: python scripts/build_release_wheels.py

      - name: Twine check
        run: twine check --strict dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-dist
          path: dist/

  publish:
    name: publish
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && vars.PYPI_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
